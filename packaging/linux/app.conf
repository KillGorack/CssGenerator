# The only file to edit when you copy packaging/linux/ into another .NET app.
# Read by build_linux.sh, install.sh and uninstall.sh (sh syntax). Paths are relative to the repo root.
APP_ID=cssgenerator                      # lowercase, no spaces: program folder, command, menu entry, download name
APP_TITLE="CSS Generator"                # name in the applications menu
APP_COMMENT="Build CSS classes and preview them against HTML"
CATEGORIES="Development;WebDevelopment;" # freedesktop menu categories (one main category)
CSPROJ=CssGenerator/CssGenerator.csproj  # the project to publish
EXE=CssGenerator                         # the program dotnet publish produces (the assembly name)
ICON=CssGenerator/Assets/icon.png        # the menu icon
ICON_SIZE=360                            # its pixel size
DATA_NOTE=""                             # no data folder: projects are .cssgen files saved where you choose
# No old install to remove.
LEGACY_DIR=""
LEGACY_DESKTOP=""
